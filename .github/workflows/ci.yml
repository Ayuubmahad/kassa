name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kassa
          POSTGRES_PASSWORD: kassa
          POSTGRES_DB: kassa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kassa -d kassa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kassa:kassa@localhost:5432/kassa
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply schema
        run: npm run db:migrate

      - name: Test
        run: npm test
